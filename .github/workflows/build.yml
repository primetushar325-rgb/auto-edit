name: Build Auto Edit

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          echo "sdk.dir=/usr/lib/android-sdk" > local.properties
          export ANDROID_HOME=/usr/lib/android-sdk
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug + release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: List APK outputs
        run: |
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload Auto-Edit-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Edit-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
